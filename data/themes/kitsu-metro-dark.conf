# ============================================
# KitsuMetro Dark Theme
# Por KitsuGui
# ============================================

[metadata]
name = KitsuMetro Dark
author = KitsuGui
is_dark = true

[palette]
# Colores base de la paleta Kitsu (dark)
orange          = #FF8800
orange_dark     = #DC6400
orange_light    = #FFAA44
dark_900        = #1A1816
dark_800        = #232018
dark_700        = #2D2A28
dark_600        = #3C3A37
dark_500        = #504E4B
gray_100        = #C8C8CD
gray_300        = #8C8C96
white           = #FFFFFF
red             = #F05050
green           = #64C864
blue            = #3CAAFF
yellow          = #FFDC3C

[tokens]
# Fondos
bg_primary      = @palette:dark_700
bg_secondary    = @palette:dark_800
bg_tertiary     = @palette:dark_600
bg_disabled     = #1E1C1A

# Texto
text_primary    = #F0F0F5
text_secondary  = @palette:gray_300
text_disabled   = #64646E
text_on_accent  = @palette:white

# Acento
accent          = @palette:orange
accent_hover    = @palette:orange_light
accent_pressed  = @palette:orange_dark
accent_disabled = #645A50

# Bordes
border          = @palette:dark_500
border_focus    = @palette:orange
border_disabled = #505055

# Estados
success         = @palette:green
warning         = @palette:yellow
error           = @palette:red
info            = @palette:blue

# Extras
scrollbar_track         = #64646950
scrollbar_thumb         = #A0A0AAB4
scrollbar_thumb_hover   = #FFB464DC
selection               = #FFB46464
shadow                  = #00000078

[style]
radius_small    = 0
radius_medium   = 0
radius_large    = 0
spacing_small   = 4
spacing_medium  = 8
spacing_large   = 16
font_size_small  = 13
font_size_normal = 15
font_size_large  = 18
font_size_title  = 22
