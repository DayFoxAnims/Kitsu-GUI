# KitsuMetro Light — tema built-in
# Coloca este archivo en data/themes/ junto al ejecutable

[metadata]
name = KitsuMetro Light
author = KitsuGui
is_dark = false

[palette]
orange       = #FF8800
orange_dark  = #DC6400
orange_light = #FFAA44
white_cold   = #F8F9FA
white        = #FFFFFF
gray_50      = #F5F5F7
gray_100     = #E6E6E9
gray_200     = #C8C8CD
gray_400     = #9696A0
gray_600     = #787882
gray_900     = #28282D
black        = #000000
red          = #DC3C3C
green        = #4CAF50
blue         = #2196F3
yellow       = #FFDC3C

[tokens]
bg_primary     = @palette:white_cold
bg_secondary   = @palette:white
bg_tertiary    = @palette:gray_50
bg_disabled    = #F0F0F2

text_primary   = @palette:gray_900
text_secondary = @palette:gray_600
text_disabled  = #A0A0A5
text_on_accent = @palette:white

accent          = @palette:orange
accent_hover    = @palette:orange_dark
accent_pressed  = @palette:orange
accent_disabled = @palette:gray_200

border          = @palette:gray_200
border_focus    = @palette:orange
border_disabled = @palette:gray_200

success = @palette:green
warning = @palette:yellow
error   = @palette:red
info    = @palette:blue

scrollbar_track       = #C8C8CD50
scrollbar_thumb       = #8C8C96B4
scrollbar_thumb_hover = #FF8800DC
selection             = #6496FF64
shadow                = #0000003C

[style]
radius_small  = 0
radius_medium = 0
radius_large  = 0

radius_checkbox       = 0
radius_switch         = 0
radius_switch_knob    = 0
radius_slider_track   = 0
radius_slider_knob    = 0
radius_radio          = 0
radius_button         = 0
radius_panel          = 0
radius_text_input     = 0
radius_viewport       = 0
radius_progress_bar   = 0

border_thin   = 1
border_normal = 2
border_thick  = 3

border_thickness_button     = 2
border_thickness_checkbox   = 2
border_thickness_switch     = 2
border_thickness_text_input = 2
border_thickness_panel      = 3
border_thickness_viewport   = 3

spacing_small  = 4
spacing_medium = 8
spacing_large  = 16
spacing_xlarge = 24

[sizes]
checkbox_size          = 18
switch_width           = 44
switch_height          = 22
switch_knob_pad        = 3
slider_track_thickness = 6
slider_knob_size       = 16
radio_size             = 18
text_input_height      = 32
button_height          = 42

[typography]
font_size_small  = 13
font_size_normal = 15
font_size_large  = 18
font_size_title  = 22
font_size_huge   = 28
